server {
    server_name whatsapp-mcp.vpsistema.com;

    location /mcp {
        if ($http_x_api_key != "SUBSTITUA_PELA_CHAVE_REAL_NUNCA_COMMITAR") { return 401; }

        proxy_pass http://127.0.0.1:8010/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8010;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Gateway de eventos (canal "gatilho de sistema") -- autenticacao por
    # token de sistema de origem e feita dentro da aplicacao (Authorization:
    # Bearer), nao aqui no Nginx, porque cada sistema tem um token proprio.
    location /events {
        proxy_pass http://127.0.0.1:8011/events;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8011;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/whatsapp-mcp.vpsistema.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whatsapp-mcp.vpsistema.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = whatsapp-mcp.vpsistema.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name whatsapp-mcp.vpsistema.com;
    return 404; # managed by Certbot
}
